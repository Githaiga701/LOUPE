[project]
name = "loupe-checks"
version = "0.1.0"
description = "Loupe checks service: one endpoint per check, run on Vercel's Python runtime."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120",
  "pydantic>=2.9",
  "httpx>=0.27",
  "pillow>=11",
  "pillow-heif>=0.20",
  "imagehash>=4.3",
  "numpy>=2",
  "c2pa-python>=0.37",
  "vercel>=0.10",
]

[project.optional-dependencies]
dev = ["uvicorn[standard]>=0.30", "pytest>=8", "pytest-asyncio>=0.24"]

[tool.vercel]
entrypoint = "loupe_checks.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loupe_checks"]
